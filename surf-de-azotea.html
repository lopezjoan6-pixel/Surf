<style>
:root{--ink:#fff5e6;--panel:rgba(26,16,60,.86);--gold:#ffd23f;--hot:#ff5c8a;--bg:#1a1240;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#dist{font-size:36px;font-weight:900;font-style:italic}
#coins{font-size:22px;font-weight:800;padding-top:8px}
#coins i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);border:2px solid #c98a00;margin-right:6px;vertical-align:-1px}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(20,10,50,.55)}
#ov.hide{display:none}
.card{margin:auto;max-width:340px;text-align:center;background:var(--panel);border-radius:28px;padding:28px 24px}
h1{margin:0 0 12px;font-size:40px;line-height:1;font-style:italic;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--hot)}
p{margin:0 0 14px;line-height:1.4;font-size:16px}
#res{font-weight:800;color:#ffe29a}
button{font:inherit;font-weight:900;font-size:22px;color:#fff;background:var(--hot);border:0;border-radius:999px;padding:14px 44px;box-shadow:0 5px 0 #b02c5c;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b02c5c}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#mute{pointer-events:auto;font-size:20px;padding:4px 10px;margin-top:8px;box-shadow:none;background:rgba(0,0,0,.35)}
#pw{font-size:20px;min-height:26px}
.alt{display:none;font-size:16px;padding:10px 22px;background:#3a2b7a;box-shadow:0 4px 0 #22174d;margin:0 0 14px}
#ad{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.88);padding:24px}
#bank{font-size:15px;margin:0 0 10px}
#cur{display:flex;justify-content:center;gap:18px;font-weight:800;margin:0 0 4px}
#pv{position:static;inset:auto;width:230px;height:210px;display:block;margin:0 auto 6px}
#tabs{display:flex;gap:6px;margin:16px 0 10px}
.tb,.chip,.it,.ob{font-size:13px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.12);box-shadow:none;font-weight:800;color:var(--ink)}
.tb{flex:1}.tb.on,.chip.on{background:var(--hot);color:#fff}
.tb:active,.chip:active,.it:active,.ob:active{transform:none;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{border:2px solid;padding:8px 4px;line-height:1.2;font-size:12px}.it b{display:block;font-size:26px;margin-bottom:2px}.it i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
.it.eq{background:rgba(255,210,63,.22);outline:2px solid var(--gold)}.it.lk{opacity:.5}
.cc{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;margin:0 0 10px}.cc small{display:block;margin:4px 0 8px;opacity:.8;font-size:12px}
.ob{background:var(--hot);color:#fff;font-size:15px;padding:10px 20px}
#chest{position:fixed;inset:0;z-index:7;display:none;background:rgba(10,5,30,.94);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cb{font-size:110px;animation:shk .16s infinite}
@keyframes shk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.rv{font-size:96px;filter:drop-shadow(0 0 26px var(--rc));animation:pop .55s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#ms{font-size:14px;text-align:left;margin:0 0 14px}#ms div{padding:3px 0}#ms .ok{color:#7cf5c6}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--hot);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;display:none;z-index:8;pointer-events:none;white-space:nowrap}
#sk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.sk{font-size:13px;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.12);box-shadow:none;line-height:1.2;font-weight:800}
.sk:active{transform:none;box-shadow:none}
.sk.on{outline:3px solid var(--gold)}
.sk i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="dist">0 m</div><div id="pw"></div></div><div id="coins"><i></i><span id="cn">0</span><br><span id="gn">💎 0</span><br><button id="mute">🔊</button></div></div>
<div id="ov"><div class="card">
<h1 id="ttl">Surf de Azotea</h1>
<p id="res"></p>
<div id="cur"><span>🪙 <b id="bk">0</b></span><span>💎 <b id="gm">0</b></span></div>
<canvas id="pv" width="460" height="420"></canvas>
<button id="rv" class="alt">▶ Ver anuncio y seguir jugando</button>
<button id="go">Jugar</button>
<div id="tabs"><button class="tb on" data-t="p">Personaje</button><button class="tb" data-t="c">Cofres</button><button class="tb" data-t="m">Misiones</button></div>
<div id="tab"></div>
<p style="font-size:12px;opacity:.7;margin:12px 0 0">Desliza: ← → carril · ↑ salta · ↓ desliza</p>
</div></div>
<div id="chest"></div>
<div id="toast"></div><div id="ad"><div><p style="font-size:22px;font-weight:900">Anuncio de prueba</p><p>Aquí irá un anuncio real. Sigues en <b>3</b></p></div></div>
<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d'),DT=.016;
const $=id=>document.getElementById(id);
let W,H,cx,hy,by,LW;
function resize(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);cx=W/2;hy=H*.3;by=H*.84;LW=Math.min(W*.3,H*.2)}
addEventListener('resize',resize);resize();

const D=380,P=z=>1/(1+z/D),Y=d=>hy+(by-hy)*d,X=(l,d)=>cx+(l-1)*LW*d;
const hh=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const fade=d=>Math.max(0,Math.min(1,(d-.09)/.08));

let st='menu',objs=[],speed,scroll=0,nextRow,lane,tl,jy,vy,slide,dist=0,coins=0,best=0,t=0,shake=0,magT=0,shd=0,mt=0,mi=0,rvd=0,bk=0,FL=0,cb=0,cbT=0,jetT=0;
try{best=+localStorage.getItem('sa_best')||0}catch(e){}
function reset(){objs=[];speed=650;scroll=0;nextRow=900;lane=1;tl=1;jy=0;vy=0;slide=0;dist=0;coins=0;magT=0;shd=0;mt=0;rvd=0;bk=0;jetT=0}
reset();

let ac,mute=false,bank=0,own=[0],skin=0;
const NT=[220,262,330,392,330,262,294,349];
const SK=[{n:'Menta',c:'#7cf5c6',p:0},{n:'Fuego',c:'#ff8a3d',p:100},{n:'Neón',c:'#b98cff',p:250},{n:'Cielo',c:'#4dc9ff',p:500},{n:'Rosa',c:'#ff8fb8',p:150},{n:'Lima',c:'#b6f23c',p:350},{n:'Rojo',c:'#ff4d4d',p:700},{n:'Oro',c:'#ffcf4d',p:1000}];
try{bank=+localStorage.getItem('sa_bank')||0;own=JSON.parse(localStorage.getItem('sa_own')||'[0]');skin=+localStorage.getItem('sa_skin')||0;mute=localStorage.getItem('sa_mute')==='1'}catch(e){}
function sv(){try{localStorage.setItem('sa_bank',bank);localStorage.setItem('sa_own',JSON.stringify(own));localStorage.setItem('sa_skin',skin);localStorage.setItem('sa_mute',mute?1:0);localStorage.setItem('sa_gems',gems);localStorage.setItem('sa_items',JSON.stringify(own2));localStorage.setItem('sa_eq',JSON.stringify(EQ));localStorage.setItem('sa_ms',JSON.stringify(msd))}catch(e){}}
function beep(f,d,ty,v,f2){
  if(mute)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}
}
function hit(o){if(shd){shd=0;o.got=true;shake=.25;beep(300,.2,'sawtooth',.12,90);return false}crash();return true}
const MS=[{t:'Corre 600 m en una partida',k:'m',n:600,r:40},{t:'Recoge 40 monedas',k:'c',n:40,r:40},{t:'Salta 20 veces',k:'j',n:20,r:30},{t:'Desliza 15 veces',k:'s',n:15,r:30},{t:'Recoge 3 potenciadores',k:'p',n:3,r:50},{t:'Corre 1500 m en total',k:'d',n:1500,r:60},{t:'Recoge 4 gemas',k:'g',n:4,r:40}];
const today=()=>Math.floor(Date.now()/864e5);
let msd={day:today(),p:[0,0,0],ok:[0,0,0]};
try{const q=JSON.parse(localStorage.getItem('sa_ms')||'null');if(q&&q.day===today())msd=q}catch(e){}
const mids=()=>[0,2,4].map(i=>(today()+i)%MS.length);
function toast(x){const e=$('toast');e.textContent=x;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function mis(k,v){
  mids().forEach((id,i)=>{const m=MS[id];if(m.k!==k||msd.ok[i])return;
    msd.p[i]=k==='m'?Math.max(msd.p[i],v):msd.p[i]+v;
    if(msd.p[i]>=m.n){msd.ok[i]=1;bank+=m.r;gems+=3;toast('¡Misión cumplida! +'+m.r+' 🪙 +3 💎')}});

  [...objs].sort((a,b)=>b.dist-a.dist).forEach(o=>{if(o.dist<3000)drawObj(o)});
  drawPlayer();
  if(st!=='menu'&&theme().st>.7){ctx.strokeStyle='rgba(180,200,255,.25)';ctx.lineWidth=1;for(let i=0;i<70;i++){const x=hh(i)*W,y=(t*900+hh(i+7)*H)%H;line(x,y,x-4,y+16)}}
  if(speed>850&&st==='play'){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;for(let i=0;i<10;i++){const x=(i%2?W*.04:W*.8)+hh(i)*W*.16,y=(t*1400+i*137)%H;line(x,y,x,y+40+speed/40)}}
  ctx.restore();
  $('dist').textContent=Math.floor(dist/100)+' m';$('cn').textContent=coins;$('gn').textContent='💎 '+gems;$('pw').textContent=(jetT>0?'🚀'+Math.ceil(jetT)+' ':'')+(magT>0?'🧲'+Math.ceil(magT)+' ':'')+(shd?'🛡️':'');
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;DT=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  if(st!=='over')update(dt);
  draw();if(!$('ov').classList.contains('hide'))drawPV();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function act(a){
  if(st!=='play')return;
  if(a==='l'){tl=Math.max(0,tl-1);beep(500,.04,'sine',.04)}
  else if(a==='r'){tl=Math.min(2,tl+1);beep(500,.04,'sine',.04)}
  else if(a==='u'){if(jy<=FL+.001){vy=4.6;jy=FL+.002;slide=0;mis('j',1);beep(300,.15,'sine',.1,600)}}
  else{slide=.6;mis('s',1);beep(400,.12,'sine',.08,200);if(jy>0)vy=-8}
}
function start(){reset();$('rv').style.display='none';beep(600,.06,'sine',.05);st='play';$('ov').classList.add('hide')}
$('go').addEventListener('click',start);

let sx=0,sy=0,sd=false;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true});
addEventListener('pointermove',e=>{
  if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28||Math.abs(dy)>28){act(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));sd=false}
});
addEventListener('pointerup',()=>sd=false);
addEventListener('keydown',e=>{
  const k=e.key;
  if(st!=='play'){if(k==='Enter'||k===' ')start();return}
  if(k==='ArrowLeft'||k==='a')act('l');
  else if(k==='ArrowRight'||k==='d')act('r');
  else if(k==='ArrowUp'||k==='w'||k===' ')act('u');
  else if(k==='ArrowDown'||k==='s')act('d');
});
</script>
