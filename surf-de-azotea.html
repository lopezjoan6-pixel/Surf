<style>
:root{--ink:#fff5e6;--panel:rgba(26,16,60,.86);--gold:#ffd23f;--hot:#ff5c8a;--bg:#1a1240;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#dist{font-size:36px;font-weight:900;font-style:italic}
#coins{font-size:22px;font-weight:800;padding-top:8px}
#coins i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);border:2px solid #c98a00;margin-right:6px;vertical-align:-1px}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(20,10,50,.55)}
#ov.hide{display:none}
.card{margin:auto;max-width:340px;text-align:center;background:var(--panel);border-radius:28px;padding:28px 24px}
h1{margin:0 0 12px;font-size:40px;line-height:1;font-style:italic;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--hot)}
p{margin:0 0 14px;line-height:1.4;font-size:16px}
#res{font-weight:800;color:#ffe29a}
button{font:inherit;font-weight:900;font-size:22px;color:#fff;background:var(--hot);border:0;border-radius:999px;padding:14px 44px;box-shadow:0 5px 0 #b02c5c;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b02c5c}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#mute{pointer-events:auto;font-size:20px;padding:4px 10px;margin-top:8px;box-shadow:none;background:rgba(0,0,0,.35)}
#pw{font-size:20px;min-height:26px}
.alt{display:none;font-size:16px;padding:10px 22px;background:#3a2b7a;box-shadow:0 4px 0 #22174d;margin:0 0 14px}
#ad{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.88);padding:24px}
#bank{font-size:15px;margin:0 0 10px}
#cur{display:flex;justify-content:center;gap:18px;font-weight:800;margin:0 0 4px}
#pv{position:static;inset:auto;width:230px;height:210px;display:block;margin:0 auto 6px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.tb,.chip,.it,.ob{font-size:13px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.12);box-shadow:none;font-weight:800;color:var(--ink)}
.tb{flex:1 1 30%}.tb.on,.chip.on{background:var(--hot);color:#fff}
.tb:active,.chip:active,.it:active,.ob:active{transform:none;box-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{border:2px solid;padding:8px 4px;line-height:1.2;font-size:12px}.it b{display:block;font-size:26px;margin-bottom:2px}.it i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
.it.eq{background:rgba(255,210,63,.22);outline:2px solid var(--gold)}.it.lk{opacity:.5}
.cc{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;margin:0 0 10px}.cc small{display:block;margin:4px 0 8px;opacity:.8;font-size:12px}
.ob{background:var(--hot);color:#fff;font-size:15px;padding:10px 20px}
#chest{position:fixed;inset:0;z-index:7;display:none;background:rgba(10,5,30,.94);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.cb{font-size:110px;animation:shk .16s infinite}
@keyframes shk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.rv{font-size:96px;filter:drop-shadow(0 0 26px var(--rc));animation:pop .55s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
#pz{pointer-events:auto;font-size:20px;padding:4px 10px;margin:8px 0 0 6px;box-shadow:none;background:rgba(0,0,0,.35)}
#cn{display:inline-block;transition:transform .12s}
#paus{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(10,5,30,.8);padding:24px}
#lv{font-size:13px;margin:0 0 4px}#lv small{opacity:.8}
.note{font-size:12px;background:rgba(255,210,63,.15);border-radius:10px;padding:8px;margin:0 0 10px}.tag{background:var(--hot);border-radius:8px;padding:1px 6px;font-size:11px}
.sec{display:block;text-align:center;color:#ffe29a;margin:10px 0 4px}.hi{padding:4px 0}
.card{background:linear-gradient(180deg,rgba(44,26,98,.94),rgba(22,14,54,.94));border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{background:linear-gradient(180deg,#fff2a8,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #ff5c8a)}
#go{background:linear-gradient(180deg,#ff7aa5,#ff4d85);font-size:26px;padding:16px 64px;letter-spacing:.5px}
#coins{background:rgba(10,5,30,.35);padding:6px 12px;border-radius:16px}
.thw{position:relative;max-height:360px;overflow-y:auto;text-align:left;padding-left:40px;touch-action:pan-y}
.th{position:absolute;left:10px;top:0;width:16px;background:rgba(255,255,255,.15);border-radius:10px}
.th i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#ff3b3b,#ff8a3d);border-radius:10px}
.th:after{content:'';position:absolute;left:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:#ff3b3b}
.rows{padding-bottom:12px}
.lr{position:relative;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;box-sizing:border-box}
.nd{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#2a1b5c;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:11px}
.lr.on .nd{background:#ff5c3b;border-color:#fff}.ri{font-size:22px}.rx{flex:1;font-weight:700}
.cl{padding:6px 10px;border-radius:10px;background:var(--hot);color:#fff;font-size:12px;box-shadow:none}
.bar{display:inline-block;width:90px;height:8px;background:rgba(255,255,255,.2);border-radius:6px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.upr{display:flex;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.08);border-radius:14px;padding:10px;margin:0 0 8px}.upr div{flex:1;font-size:13px}.upr small{opacity:.8}
.up{padding:8px 12px;border-radius:12px;background:var(--hot);color:#fff;font-size:13px;box-shadow:none}
#ms{font-size:14px;text-align:left;margin:0 0 14px}#ms div{padding:3px 0}#ms .ok{color:#7cf5c6}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--hot);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;display:none;z-index:8;pointer-events:none;white-space:nowrap}
#sk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.sk{font-size:13px;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.12);box-shadow:none;line-height:1.2;font-weight:800}
.sk:active{transform:none;box-shadow:none}
.sk.on{outline:3px solid var(--gold)}
.sk i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 4px}
</style>
</head>

  else if(h==='h4'){ctx.fillStyle='#15121f';ctx.beginPath();ctx.ellipse(0,fy0-.05*u,.19*u,.045*u,0,0,7);ctx.fill();ctx.fillRect(-.12*u,fy0-.27*u,.24*u,.23*u);ctx.fillStyle='#e63946';ctx.fillRect(-.12*u,fy0-.1*u,.24*u,.04*u)}
  else if(h==='h8'){ctx.fillStyle='#8a5a30';ctx.beginPath();ctx.ellipse(0,fy0-.06*u,.21*u,.05*u,0,0,7);ctx.fill();ctx.fillStyle='#a86f3c';rr(-.11*u,fy0-.2*u,.22*u,.15*u,.05*u);ctx.fill();ctx.fillStyle='#5b3a1e';ctx.fillRect(-.11*u,fy0-.09*u,.22*u,.03*u)}
  else if(h==='h9'){for(const sd of[-1,1]){poly([[sd*.03*u,fy0-.1*u],[sd*.13*u,fy0-.1*u],[sd*.11*u,fy0-.24*u]],'#3a2416');poly([[sd*.06*u,fy0-.11*u],[sd*.12*u,fy0-.11*u],[sd*.11*u,fy0-.2*u]],'#ff8fb8')}}
  else if(h==='hA'){ctx.strokeStyle='rgba(255,233,138,.35)';ctx.lineWidth=.07*u;ctx.beginPath();ctx.ellipse(0,fy0-.22*u,.12*u,.04*u,0,0,7);ctx.stroke();ctx.strokeStyle='#ffe98a';ctx.lineWidth=.03*u;ctx.beginPath();ctx.ellipse(0,fy0-.22*u,.12*u,.04*u,0,0,7);ctx.stroke()}
  else if(h==='h6'){ctx.strokeStyle='#222';ctx.lineWidth=.03*u;ctx.beginPath();ctx.arc(0,fy0,.14*u,Math.PI,0);ctx.stroke();disc(-.14*u,fy0+.01*u,.05*u,'#ff5c8a');disc(.14*u,fy0+.01*u,.05*u,'#ff5c8a')}
  else if(h==='h7'){for(const sd of[-1,1])poly([[sd*.05*u,fy0-.1*u],[sd*.13*u,fy0-.1*u],[sd*.11*u,fy0-.24*u]],'#e63946')}
  else{ctx.fillStyle='#ffcf4d';ctx.fillRect(-.12*u,fy0-.1*u,.24*u,.05*u);for(const dx of[-.1,0,.1])poly([[dx*u-.04*u,fy0-.1*u],[dx*u+.04*u,fy0-.1*u],[dx*u,fy0-.2*u]],'#ffcf4d');disc(0,fy0-.075*u,.015*u,'#e63946')}
  ctx.restore();ctx.lineCap='butt';
}
function drawPlayer(){
  const x=X(lane,1),u=LW,air=jy>FL+.02||jetT>0,k=slide>0&&!air?Math.min(1,(.6-slide)*9,slide*7):0;
  {const sc=1-Math.min(jy,1.5)*.3,sg2=ctx.createRadialGradient(x,by,0,x,by,.36*u*sc);sg2.addColorStop(0,'rgba(0,0,0,.5)');sg2.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.translate(x,by);ctx.scale(1,.24);ctx.translate(-x,-by);ctx.fillStyle=sg2;ctx.fillRect(x-.4*u,by-.4*u,.8*u,.8*u);ctx.restore()}
  if(st==='play'){emit(pts,x,by-jy*u,u);if(k>0&&Math.random()<.8)pts.push({x:x+(Math.random()-.5)*.3*u,y:by-.02*u,vx:(Math.random()-.5)*110,vy:40+Math.random()*90,l:.8,e:Math.random()<.5?21:20,s:0,u})}
  drawPts(pts);
  drawChar(x,by-jy*u,u,{air,k,ph:st==='play'?t*13:t*6,tilt:(tl-lane)*.15,shd:shd>0,jet:jetT>0});
}
function drawPV(){
  const c=$('pv'),g=c.getContext('2d'),old=ctx;ctx=g;g.clearRect(0,0,c.width,c.height);
  const r=g.createRadialGradient(230,330,10,230,330,200);r.addColorStop(0,'rgba(255,255,255,.22)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,c.width,c.height);
  g.fillStyle='rgba(255,255,255,.1)';g.beginPath();g.ellipse(230,372,150,26,0,0,7);g.fill();
  emit(ppts,230,372,190);drawPts(ppts);
  drawChar(230,372,190,{air:false,sl:false,ph:t*5,tilt:Math.sin(t*1.5)*.05});
  ctx=old;
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
  camL=(lane-1)*.45;drawWorld();drawDecos();drawTunnels();
  [...objs].sort((a,b)=>b.dist-a.dist).forEach(o=>{if(o.dist<4200)drawObj(o)});
  drawPlayer();drawCfx();vig();
  if(st!=='menu'&&theme().st>.7){ctx.strokeStyle='rgba(180,200,255,.25)';ctx.lineWidth=1;for(let i=0;i<70;i++){const x=hh(i)*W,y=(t*900+hh(i+7)*H)%H;line(x,y,x-4,y+16)}}
  if(speed>1550&&st==='play'){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;for(let i=0;i<10;i++){const x=(i%2?W*.04:W*.8)+hh(i)*W*.16,y=(t*1400+i*137)%H;line(x,y,x,y+40+speed/40)}}
  ctx.restore();
  $('dist').textContent=Math.floor(dist/100)+' m';$('cn').textContent=coins;$('gn').textContent='💎 '+gems;$('pw').textContent=(x2run?'🪙x2 ':'')+(slowT>0?'⏱️'+Math.ceil(slowT)+' ':'')+(x2T>0?'💰'+Math.ceil(x2T)+' ':'')+(sjT>0?'🦘'+Math.ceil(sjT)+' ':'')+(jetT>0?'🚀'+Math.ceil(jetT)+' ':'')+(magT>0?'🧲'+Math.ceil(magT)+' ':'')+(shd?'🛡️':'');
}

let last=performance.now();
function loop(n){
  const raw=(n-last)/1000,dt=Math.min(.033,raw);fa=fa*.95+Math.min(raw,.1)*.05;if(n-lastQ>2500&&fa>.026&&qs>1.5){qs-=.5;lastQ=n;fa=.016;resize()}last=n;t+=dt;DT=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  if(st!=='over'&&st!=='pause')update(dt);
  draw();if(!$('ov').classList.contains('hide'))drawPV();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function act(a){
  if(st!=='play')return;
  if(a==='l'){tl=Math.max(0,tl-1);beep(500,.04,'sine',.04)}
  else if(a==='r'){tl=Math.min(2,tl+1);beep(500,.04,'sine',.04)}
  else if(a==='u'){if(jy<=FL+.001){vy=sjT>0?7.4:4.6;jy=FL+.002;slide=0;mis('j',1);beep(300,.15,'sine',.1,600)}}
  else{slide=.6;mis('s',1);beep(400,.12,'sine',.08,200);if(jy>0)vy=-8}
}
function start(){reset();calcS();if(inv.shd>0){inv.shd--;shd=Math.max(shd,1)}if(inv.mag>0){inv.mag--;magT=dur(8,'mag')}if(inv.jet>0){inv.jet--;jetT=dur(4,'jet')}if(inv.x2>0){inv.x2--;x2run=1}if(inv.slow>0){inv.slow--;slowT=dur(6,'slow')}if(inv.sj>0){inv.sj--;sjT=dur(10,'sj')}sv();$('rv').style.display='none';beep(600,.06,'sine',.05);st='play';$('ov').classList.add('hide')}
$('go').addEventListener('click',start);

let sx=0,sy=0,sd=false;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true});
addEventListener('pointermove',e=>{
  if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28||Math.abs(dy)>28){act(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));sd=false}
});
addEventListener('pointerup',()=>sd=false);
addEventListener('keydown',e=>{
  const k=e.key;
  if(st==='pause'){if(k==='Escape'||k==='p'||k==='Enter')resume();return}
  if(st!=='play'){if(k==='Enter'||k===' ')start();return}
  if(k==='ArrowLeft'||k==='a')act('l');
  else if(k==='ArrowRight'||k==='d')act('r');
  else if(k==='ArrowUp'||k==='w'||k===' ')act('u');
  else if(k==='ArrowDown'||k==='s')act('d');
  else if(k==='p'||k==='Escape')pause();
});
</script>
