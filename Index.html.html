<style>
:root{--ink:#fff5e6;--panel:rgba(26,16,60,.86);--gold:#ffd23f;--hot:#ff5c8a;--bg:#1a1240;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#dist{font-size:36px;font-weight:900;font-style:italic}
#coins{font-size:22px;font-weight:800;padding-top:8px}
#coins i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);border:2px solid #c98a00;margin-right:6px;vertical-align:-1px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(20,10,50,.55)}
#ov.hide{display:none}
.card{max-width:340px;text-align:center;background:var(--panel);border-radius:28px;padding:28px 24px}
h1{margin:0 0 12px;font-size:40px;line-height:1;font-style:italic;font-weight:900;color:var(--gold);text-shadow:0 3px 0 var(--hot)}
p{margin:0 0 14px;line-height:1.4;font-size:16px}
#res{font-weight:800;color:#ffe29a}
button{font:inherit;font-weight:900;font-size:22px;color:#fff;background:var(--hot);border:0;border-radius:999px;padding:14px 44px;box-shadow:0 5px 0 #b02c5c;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b02c5c}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#mute{pointer-events:auto;font-size:20px;padding:4px 10px;margin-top:8px;box-shadow:none;background:rgba(0,0,0,.35)}
#pw{font-size:20px;min-height:26px}
.alt{display:none;font-size:16px;padding:10px 22px;background:#3a2b7a;box-shadow:0 4px 0 #22174d;margin:0 0 14px}
#ad{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.88);padding:24px}
#bank{font-size:15px;margin:0 0 10px}
#sk{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px}
.sk{font-size:13px;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.12);box-shadow:none;line-height:1.2;font-weight:800}
.sk:active{transform:none;box-shadow:none}
.sk.on{outline:3px solid var(--gold)}
.sk i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="dist">0 m</div><div id="pw"></div></div><div id="coins"><i></i><span id="cn">0</span><br><button id="mute">🔊</button></div></div>
<div id="ov"><div class="card">
<h1 id="ttl">Surf de Azotea</h1>
<p id="msg">Desliza a izquierda o derecha para cambiar de carril, arriba para saltar y abajo para deslizarte. Recoge 🧲 imán y 🛡️ escudo.</p>
<p id="res"></p><p id="bank"></p><div id="sk"></div>
<button id="rv" class="alt">▶ Ver anuncio y seguir jugando</button>
<button id="go">Jugar</button>
</div></div>
<div id="ad"><div><p style="font-size:22px;font-weight:900">Anuncio de prueba</p><p>Aquí irá un anuncio real. Sigues en <b>3</b></p></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,cx,hy,by,LW;
function resize(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);cx=W/2;hy=H*.3;by=H*.84;LW=Math.min(W*.3,H*.2)}
addEventListener('resize',resize);resize();

const D=380,P=z=>1/(1+z/D),Y=d=>hy+(by-hy)*d,X=(l,d)=>cx+(l-1)*LW*d;
const hh=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const fade=d=>Math.max(0,Math.min(1,(d-.09)/.08));

let st='menu',objs=[],speed,scroll=0,nextRow,lane,tl,jy,vy,slide,dist=0,coins=0,best=0,t=0,shake=0,magT=0,shd=0,mt=0,mi=0,rvd=0,bk=0;
try{best=+localStorage.getItem('sa_best')||0}catch(e){}
function reset(){objs=[];speed=650;scroll=0;nextRow=900;lane=1;tl=1;jy=0;vy=0;slide=0;dist=0;coins=0;magT=0;shd=0;mt=0;rvd=0;bk=0}
reset();

let ac,mute=false,bank=0,own=[0],skin=0;
const NT=[220,262,330,392,330,262,294,349];
const SK=[{n:'Menta',c:'#7cf5c6',p:0},{n:'Fuego',c:'#ff8a3d',p:100},{n:'Neón',c:'#b98cff',p:250},{n:'Cielo',c:'#4dc9ff',p:500}];
try{bank=+localStorage.getItem('sa_bank')||0;own=JSON.parse(localStorage.getItem('sa_own')||'[0]');skin=+localStorage.getItem('sa_skin')||0;mute=localStorage.getItem('sa_mute')==='1'}catch(e){}
function sv(){try{localStorage.setItem('sa_bank',bank);localStorage.setItem('sa_own',JSON.stringify(own));localStorage.setItem('sa_skin',skin);localStorage.setItem('sa_mute',mute?1:0)}catch(e){}}
function beep(f,d,ty,v,f2){
  if(mute)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
    o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}
}
function hit(o){if(shd){shd=0;o.got=true;shake=.25;beep(300,.2,'sawtooth',.12,90);return false}crash();return true}
function shop(){
  $('bank').textContent='Tienes '+bank+' monedas';$('sk').innerHTML='';
  SK.forEach((s,i)=>{
    const b=document.createElement('button'),o=own.includes(i);
    b.className='sk'+(i===skin?' on':'');
    b.innerHTML='<i style="background:'+s.c+'"></i>'+s.n+'<br>'+(o?(i===skin?'Elegido':'Usar'):s.p+' monedas');
    b.onclick=()=>{
      if(o)skin=i;else if(bank>=s.p){bank-=s.p;own.push(i);skin=i;beep(500,.25,'triangle',.1,1000)}else beep(150,.2,'sawtooth',.08);
      sv();shop()};
    $('sk').appendChild(b);
  });
}
function showAd(cb){
  if(window.showRewardedAd)return window.showRewardedAd(cb);
  const a=$('ad'),b=a.querySelector('b');let n=3;b.textContent=n;a.style.display='flex';
  const iv=setInterval(()=>{n--;b.textContent=n;if(n<=0){clearInterval(iv);a.style.display='none';cb()}},1000);
}
$('rv').onclick=()=>showAd(()=>{objs=objs.filter(o=>o.dist>900);shd=1;rvd=1;speed=Math.max(650,speed*.7);jy=0;vy=0;st='play';$('ov').classList.add('hide');$('rv').style.display='none'});
$('mute').textContent=mute?'🔇':'🔊';
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊';sv()};
shop();

function spawnRow(at){
  const free=(Math.random()*3)|0;let maxLen=0;
  const blk=[0,1,2].filter(i=>i!==free).filter((_,i,a)=>a.length===1||i===0||Math.random()<.7);
  blk.forEach(l=>{
    const r=Math.random();const ty=r<.28?'train':r<.64?'bar':'high';
    const len=ty==='train'?420:40;maxLen=Math.max(maxLen,len);
    objs.push({t:ty,lane:l,dist:at,len,v:ty==='train'&&dist>2000&&Math.random()<.4?400:0});
  });
  const pr=Math.random();
  if(pr<.1)objs.push({t:Math.random()<.5?'mag':'shd',lane:free,dist:at,len:0,ph:0});
  else if(pr<.65)for(let i=0;i<5;i++)objs.push({t:'coin',lane:free,dist:at+i*90,len:0,ph:Math.random()*6});
  return maxLen;
}

function crash(){
  st='over';shake=.4;
  const m=Math.floor(dist/100);
  if(m>best){best=m;try{localStorage.setItem('sa_best',best)}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  beep(200,.5,'sawtooth',.15,40);bank+=coins-bk;bk=coins;sv();shop();$('rv').style.display=rvd?'none':'block';
  $('ttl').textContent='¡Te estrellaste!';
  $('msg').style.display='none';
  $('res').textContent=m+' m · '+coins+' monedas · récord '+best+' m';
  $('go').textContent='Jugar otra vez';
  setTimeout(()=>$('ov').classList.remove('hide'),450);
}

function update(dt){
  if(st==='menu'){scroll+=260*dt;return}
  speed=Math.min(1350,speed+dt*14);magT=Math.max(0,magT-dt);
  mt+=dt;if(mt>.23){mt=0;beep(NT[mi++%8],.2,'triangle',.05)}
  const mv=speed*dt;scroll+=mv;dist+=mv;nextRow-=mv;
  while(nextRow<3000){const m=spawnRow(nextRow);nextRow+=speed*(.8+Math.random()*.4)+m}
  lane+=(tl-lane)*Math.min(1,dt*14);
  if(jy>0||vy>0){vy-=12*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0}}
  slide=Math.max(0,slide-dt);
  for(const o of objs){
    o.dist-=mv+(o.v||0)*dt;if(o.t==='coin'&&magT>0&&o.dist<900)o.lane+=(lane-o.lane)*Math.min(1,dt*9);
    if(o.got||o.dist>28||o.dist+o.len<-28||Math.abs(lane-o.lane)>.55)continue;
    if(o.t==='coin'){o.got=true;coins++;beep(880,.08,'square',.05,1320)}
    else if(o.t==='mag'){o.got=true;magT=8;beep(500,.25,'triangle',.1,1000)}
    else if(o.t==='shd'){o.got=true;shd=1;beep(500,.25,'triangle',.1,1000)}
    else if(o.t==='bar'){if(jy<.42&&hit(o))return}
    else if(o.t==='high'){if((slide<=0||jy>.05)&&hit(o))return}
    else if(hit(o))return;
  }
  objs=objs.filter(o=>!o.got&&o.dist+o.len>-220);
}

function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}

function drawWorld(){
  const g=ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0,'#2a1b5c');g.addColorStop(.6,'#ff6f91');g.addColorStop(1,'#ffc46b');
  ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,hy+30);
  ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.arc(cx,hy,W*.17,Math.PI,0);ctx.fill();
  ctx.fillStyle='#3a2470';
  for(let i=0;i<16;i++){const h=14+hh(i)*34;ctx.fillRect(i*W/15-12,hy-h,W/15+2,h)}
  ctx.fillStyle=bgc;ctx.fillRect(-30,hy,W+60,H-hy+30);
  const dH=(H+20-hy)/(by-hy);
  poly([[cx-1.5*LW*dH,H+20],[cx+1.5*LW*dH,H+20],[cx,hy]],'#2e2762');
  // ties + lane dashes
  const S=260,off=scroll%S;
  ctx.strokeStyle='#8f86d9';
  for(let k=0;k<13;k++){
    const z0=k*S-off,z1=z0+S*.5;if(z1<-150)continue;
    const d0=P(Math.max(z0,-150)),d1=P(z1);
    ctx.lineWidth=3*d0+.5;
    for(const l of[.5,1.5])line(X(l,d0),Y(d0),X(l,d1),Y(d1));
    const dz=P(z0>-150?z0:-150);ctx.globalAlpha=.3*fade(dz+.05);ctx.lineWidth=2*dz+.3;
    line(X(-.5,dz),Y(dz),X(2.5,dz),Y(dz));ctx.globalAlpha=1;
  }
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=3;
  line(cx-1.5*LW*dH,H+20,cx,hy);line(cx+1.5*LW*dH,H+20,cx,hy);
  // buildings
  const BS=420,base=Math.floor(scroll/BS),bo=scroll%BS;
  for(let k=8;k>=0;k--){
    const z=k*BS-bo;if(z<-200)continue;
    const d=P(z),y=Y(d);
    for(const s of[-1,1]){
      const id=base+k,h=hh(id*2+(s>0?1:0));
      const c=s<0?-1.6-h*.4:3.6+h*.4,bw=1.6*LW*d,bh=(2.5+h*4)*LW*d,bx=X(c,d)-bw/2;
      ctx.globalAlpha=fade(d);
      ctx.fillStyle=(id+s)&1?'#2b1e63':'#221856';ctx.fillRect(bx,y-bh,bw,bh);
      ctx.fillStyle='#ffd479';
      for(let r=1;r*.55*LW*d<bh-.3*LW*d;r++)for(let q=0;q<3;q++)
        if(hh(id*31+r*7+q*13+s)>.55)ctx.fillRect(bx+bw*(.12+q*.3),y-r*.55*LW*d,bw*.16,LW*.16*d);
      ctx.globalAlpha=1;
    }
  }
}
const bgc='#1a1240';

function drawObj(o){
  const dz=Math.max(o.dist,-190),d=P(dz);ctx.globalAlpha=fade(d);
  const x=X(o.lane,d),y=Y(d);
  if(o.t==='bar'){
    const w=.85*LW*d,h=.4*LW*d;
    ctx.fillStyle='#ffd23f';ctx.fillRect(x-w/2,y-h,w,h);
    ctx.fillStyle='#2a1b5c';
    for(let i=0;i<4;i++)ctx.fillRect(x-w/2+w*(.1+i*.25),y-h,w*.12,h);
  }else if(o.t==='high'){
    const pw=.08*LW*d;
    ctx.fillStyle='#2a1b5c';ctx.fillRect(x-.42*LW*d,y-1.7*LW*d,pw,1.7*LW*d);ctx.fillRect(x+.42*LW*d-pw,y-1.7*LW*d,pw,1.7*LW*d);
    ctx.fillStyle='#f0468a';ctx.fillRect(x-.46*LW*d,y-1.7*LW*d,.92*LW*d,1.2*LW*d);
    ctx.fillStyle='#fff';ctx.font='900 '+(.8*LW*d)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('↓',x,y-1.1*LW*d);
  }else if(o.t==='mag'||o.t==='shd'){
    const r=.28*LW*d,yy=y-.55*LW*d+Math.sin(t*4)*.05*LW*d;
    ctx.fillStyle=o.t==='mag'?'#4d7cff':'#3ddc97';ctx.beginPath();ctx.arc(x,yy,r,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.font=(.32*LW*d)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(o.t==='mag'?'🧲':'🛡️',x,yy+1);
  }else if(o.t==='train'){
    const d2=P(o.dist+o.len),x2=X(o.lane,d2),y2=Y(d2),hw=.43*LW,Ht=1.5*LW;
    if(o.lane!==1){const sx=o.lane===0?1:-1;
      poly([[x+sx*hw*d,y],[x+sx*hw*d,y-Ht*d],[x2+sx*hw*d2,y2-Ht*d2],[x2+sx*hw*d2,y2]],'#a83355');}
    poly([[x-hw*d,y-Ht*d],[x+hw*d,y-Ht*d],[x2+hw*d2,y2-Ht*d2],[x2-hw*d2,y2-Ht*d2]],'#ff7b8a');
    ctx.fillStyle='#e8505b';ctx.fillRect(x-hw*d,y-Ht*d,2*hw*d,Ht*d);
    ctx.fillStyle='#2b1450';ctx.fillRect(x-hw*.8*d,y-Ht*.9*d,1.6*hw*d,Ht*.35*d);
    ctx.fillStyle='#ffe29a';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(x+s*hw*.5*d,y-Ht*.2*d,.09*LW*d,0,7);ctx.fill()}
  }else{
    const r=.16*LW*d,rx=r*Math.abs(Math.cos(t*6+o.ph))+r*.15;
    ctx.fillStyle='#ffd23f';ctx.strokeStyle='#c98a00';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y-.4*LW*d,rx,r,0,0,7);ctx.fill();ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const x=X(lane,1),u=LW,gy=by-jy*u,run=st==='play'&&jy===0;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,by,.32*u*(1-jy*.4),.07*u,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,gy);ctx.rotate((tl-lane)*.18);
  if(shd){ctx.strokeStyle='rgba(61,220,151,.85)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-.5*u,.62*u,0,7);ctx.stroke()}
  ctx.fillStyle='#ffd23f';ctx.fillRect(-.3*u,-.09*u,.6*u,.07*u);
  const sw=run||st==='menu'?Math.sin(t*14)*.08*u:0;
  if(slide>0){
    ctx.fillStyle=SK[skin].c;ctx.fillRect(-.3*u,-.3*u,.55*u,.2*u);
    ctx.fillStyle='#f2b48c';ctx.beginPath();ctx.arc(.32*u,-.22*u,.1*u,0,7);ctx.fill();
    ctx.fillStyle='#ff5c8a';ctx.beginPath();ctx.arc(.32*u,-.24*u,.1*u,Math.PI,0);ctx.fill();
  }else{
    ctx.fillStyle='#2a1b5c';
    ctx.fillRect(-.16*u+sw,-.4*u,.1*u,.31*u);ctx.fillRect(.06*u-sw,-.4*u,.1*u,.31*u);
    ctx.fillStyle=SK[skin].c;ctx.fillRect(-.18*u,-.78*u,.36*u,.4*u);
    ctx.fillRect(-.27*u,-.74*u-sw*.5,.09*u,.3*u);ctx.fillRect(.18*u,-.74*u+sw*.5,.09*u,.3*u);
    ctx.fillStyle='#f2b48c';ctx.beginPath();ctx.arc(0,-.9*u,.11*u,0,7);ctx.fill();
    ctx.fillStyle='#ff5c8a';ctx.beginPath();ctx.arc(0,-.92*u,.115*u,Math.PI,0);ctx.fill();
    ctx.fillRect(-.02*u,-.93*u,.2*u,.04*u);
  }
  ctx.restore();
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
  drawWorld();
  [...objs].sort((a,b)=>b.dist-a.dist).forEach(o=>{if(o.dist<3000)drawObj(o)});
  drawPlayer();
  ctx.restore();
  $('dist').textContent=Math.floor(dist/100)+' m';$('cn').textContent=coins;$('pw').textContent=(magT>0?'🧲'+Math.ceil(magT)+' ':'')+(shd?'🛡️':'');
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  if(st!=='over')update(dt);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function act(a){
  if(st!=='play')return;
  if(a==='l'){tl=Math.max(0,tl-1);beep(500,.04,'sine',.04)}
  else if(a==='r'){tl=Math.min(2,tl+1);beep(500,.04,'sine',.04)}
  else if(a==='u'){if(jy<=0){vy=4.2;jy=.001;slide=0;beep(300,.15,'sine',.1,600)}}
  else{slide=.6;beep(400,.12,'sine',.08,200);if(jy>0)vy=-8}
}
function start(){reset();$('rv').style.display='none';beep(600,.06,'sine',.05);st='play';$('ov').classList.add('hide')}
$('go').addEventListener('click',start);

let sx=0,sy=0,sd=false;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true});
addEventListener('pointermove',e=>{
  if(!sd)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28||Math.abs(dy)>28){act(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));sd=false}
});
addEventListener('pointerup',()=>sd=false);
addEventListener('keydown',e=>{
  const k=e.key;
  if(st!=='play'){if(k==='Enter'||k===' ')start();return}
  if(k==='ArrowLeft'||k==='a')act('l');
  else if(k==='ArrowRight'||k==='d')act('r');
  else if(k==='ArrowUp'||k==='w'||k===' ')act('u');
  else if(k==='ArrowDown'||k==='s')act('d');
});
</script>
</body>
